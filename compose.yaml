services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-food_mapp_development}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-food_mapp_development}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-food_mapp_development}
      DB_QUEUE_NAME: ${DB_QUEUE_NAME:-food_mapp_development_queue}
      DB_TEST_NAME: ${DB_TEST_NAME:-food_mapp_test}
      DB_QUEUE_TEST_NAME: ${DB_QUEUE_TEST_NAME:-food_mapp_test_queue}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    command: bin/rails server -b 0.0.0.0 -p 3000

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      APP_PORT: ${APP_PORT:-3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-food_mapp_development}
      DB_QUEUE_NAME: ${DB_QUEUE_NAME:-food_mapp_development_queue}
      DB_TEST_NAME: ${DB_TEST_NAME:-food_mapp_test}
      DB_QUEUE_TEST_NAME: ${DB_QUEUE_TEST_NAME:-food_mapp_test_queue}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    command: bundle exec rake solid_queue:start

volumes:
  postgres_data:
  bundle_cache:
